# Times are UTC. Sydney = UTC+10/+11, US Eastern = UTC-4/-5.
#  - 13:00 UTC  morning snapshot (~11pm-midnight Sydney, ~9am ET): grade last night, refresh data,
#               project the slate, log DraftKings lines + full prop menu (free)
#  - every 10 min 14:00-05:50 UTC, and every 5 min when a game tips within 2 hours: game-day
#               loop. Checks injuries/lineups and the free DraftKings props (ESPN) on every run and
#               re-projects when either changed, so early games (US weekend afternoons, Europe/Mexico
#               games, ~3-7am Sydney) are covered as well as the usual ~10am-2pm Sydney slate.
#               ~40 min before each tip it buys that game's AU-book props (The Odds API: 1 credit
#               per game) + AU game lines once a day. Free on a public repo (Actions minutes are
#               unlimited); nothing is committed when nothing changed.
# GitHub's scheduler can start jobs several minutes late, so the pre-tip window is 40 min wide.
name: game-day

on:
  schedule:
    - cron: "0 13 * * *"
    - cron: "*/10 14-23 * * *"
    - cron: "*/10 0-5 * * *"
    - cron: "5-55/10 14-23 * * *"
    - cron: "5-55/10 0-5 * * *"
  workflow_dispatch:
    inputs:
      command:
        description: "snapshot or live"
        default: "live"

permissions:
  contents: write
  issues: write

concurrency:
  group: nba-projections
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore latest weekly model
        uses: actions/cache/restore@v4
        with:
          path: |
            models/bundle.pkl
            models/rotation_iso.pkl
          key: model-none
          restore-keys: model-
      - name: Run
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_REGIONS: ${{ vars.ODDS_REGIONS || 'au' }}
          PROP_MARKETS: ${{ vars.PROP_MARKETS || 'player_points' }}
        run: |
          CMD="${{ github.event.inputs.command }}"
          if [ -z "$CMD" ]; then
            case "${{ github.event.schedule }}" in
              "0 13 * * *") CMD=snapshot ;;
              5-55/10*) CMD="live --near-tip-only" ;;
              *) CMD=live ;;
            esac
          fi
          python -m nbamodel.cli $CMD
      - name: Commit logs
        run: |
          git config user.name "nba-model-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f TODAY.md logs output data/processed/current_season_* data/processed/espn_crosswalk.json || true
          if ! git diff --cached --quiet; then
            git commit -m "projections $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push
          fi
      - name: Open an issue if runs are failing (once)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(gh issue list --state open --search 'Daily run failing in:title' --json number --jq '.[].number')" ]; then
            gh issue create --title "Daily run failing" --body "First failure: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
