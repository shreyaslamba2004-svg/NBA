# Game-day projections. GitHub's cron trigger never fired for this repo, so this workflow runs as
# a relay: one job runs nbamodel/loop.py for ~5.4 hours (snapshot each morning from 13:00 UTC,
# live checks every 30 min until midnight Sydney, 15 min overnight, 5 min from 3 hours before a tip,
# Monday retrain kick-off), then
# starts the next job before it ends. keepalive.yml restarts the relay if it ever stops.
# To start it by hand: Actions > game-day > Run workflow (command: loop).
# One-off commands also work: snapshot or live.
# Free on a public repo (Actions minutes are unlimited); nothing is committed when nothing changed.
name: game-day

on:
  workflow_dispatch:
    inputs:
      command:
        description: "loop (normal), snapshot or live"
        default: "loop"

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: nba-projections
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore latest weekly model
        uses: actions/cache/restore@v4
        with:
          path: |
            models/bundle.pkl
            models/rotation_iso.pkl
          key: model-none
          restore-keys: model-
      - name: Run
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ODDS_REGIONS: ${{ vars.ODDS_REGIONS || 'au' }}
          PROP_MARKETS: ${{ vars.PROP_MARKETS || 'player_points' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "nba-model-bot"
          git config user.email "actions@users.noreply.github.com"
          CMD="${{ github.event.inputs.command || 'loop' }}"
          if [ "$CMD" = "loop" ]; then
            python -m nbamodel.loop
          else
            python -m nbamodel.cli $CMD
            git add -f TODAY.md LADDERS.md logs output data/processed/current_season_* data/processed/espn_crosswalk.json || true
            if ! git diff --cached --quiet; then
              git commit -m "projections $(date -u +%Y-%m-%dT%H:%MZ)"
              git pull --rebase origin "${GITHUB_REF_NAME}" && git push
            fi
          fi
      - name: Hand over to the next run
        if: always() && (github.event.inputs.command || 'loop') == 'loop'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run game-day.yml --ref "${GITHUB_REF_NAME}" -f command=loop
      - name: Open an issue if runs are failing (once)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(gh issue list --state open --search 'Daily run failing in:title' --json number --jq '.[].number')" ]; then
            gh issue create --title "Daily run failing" --body "First failure: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
